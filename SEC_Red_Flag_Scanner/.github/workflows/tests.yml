name: SEC Filing Risk Lab CI

on:
  push:
    branches: [main, v7-2-update]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: SEC_Red_Flag_Scanner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r SEC_Red_Flag_Scanner/requirements.txt pytest

      - name: Compile application
        run: python -m py_compile SEC_Red_Flag_Scanner/app.py

      - name: Run offline logic tests
        run: python -m pytest -q SEC_Red_Flag_Scanner/test_sec_filing_risk_lab_v7_2.py
